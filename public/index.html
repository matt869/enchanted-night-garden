<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="An interactive 3D night garden that blooms in your browser — 14 procedural flowers under a starlit sky, color-shifting moths, changing weather, dream-flowers, and a looping soundtrack. A single self-contained page.">
<meta name="theme-color" content="#070714">
<meta property="og:title" content="Enchanted Night Garden">
<meta property="og:description" content="Tap a flower open, watch moths drift through, change the weather, and dream up flowers that never existed. An interactive 3D night garden.">
<meta property="og:type" content="website">
<title>Enchanted Night Garden</title>
<style>
    html,body{ height:100%; }
    body { margin:0; overflow:hidden; font-family:'Segoe UI','Poppins',system-ui,sans-serif; background:#070714; }
    #flowerCanvas{ display:block; }

    /* cinematic vignette */
    #vignette{
        position:fixed; inset:0; pointer-events:none; z-index:5;
        background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(2,2,12,0.62) 100%);
    }

    /* intro veil */
    #intro{
        position:fixed; inset:0; z-index:60; pointer-events:none;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        background:#070714; animation:introFade 2.8s ease forwards;
    }
    #intro .star{ font-size:20px; color:rgba(255,200,220,0.8); animation:starSpin 2.8s ease; }
    #intro h2{
        margin:14px 0 6px; font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:22px;
        letter-spacing:7px; text-transform:uppercase; color:rgba(255,228,238,0.92);
        text-shadow:0 0 22px rgba(255,130,170,0.5);
    }
    #intro p{ margin:0; font-family:Georgia,serif; font-style:italic; font-size:13px;
        letter-spacing:3px; color:rgba(255,205,222,0.55); }
    @keyframes introFade{ 0%{opacity:1} 50%{opacity:1} 100%{opacity:0; visibility:hidden} }
    @keyframes starSpin{ 0%{transform:rotate(0) scale(0.6); opacity:0} 40%{opacity:1} 100%{transform:rotate(180deg) scale(1)} }

    #title { position:absolute; top:15px; left:0; right:0; text-align:center; pointer-events:none; z-index:10; transition:opacity .6s ease; }
    #title h1 {
        margin:0; font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:18px;
        letter-spacing:6px; color:rgba(255,228,238,0.92); text-transform:uppercase;
        text-shadow:0 0 18px rgba(255,130,170,0.55), 0 0 44px rgba(255,130,170,0.22);
    }
    #title h1 .tstar{ font-size:11px; vertical-align:3px; color:rgba(255,190,215,0.6); margin:0 10px; }

    #switcher {
        position:absolute; top:48px; left:0; right:0;
        display:flex; justify-content:center; gap:7px; flex-wrap:wrap; z-index:20; padding:0 14px;
        max-width:900px; margin:0 auto; transition:opacity .6s ease;
    }
    .flower-btn {
        appearance:none; border:1px solid rgba(255,160,190,0.30);
        background:rgba(28,17,42,0.5); color:rgba(255,222,232,0.82);
        backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
        border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:500;
        letter-spacing:0.4px; cursor:pointer; transition:all 0.3s ease; flex-shrink:0;
    }
    .flower-btn:hover { border-color:rgba(255,170,200,0.8); box-shadow:0 0 12px rgba(255,130,170,0.3); transform:translateY(-1px); }
    .flower-btn:focus-visible { outline:2px solid rgba(255,190,210,0.9); outline-offset:2px; }
    .flower-btn.active {
        background:linear-gradient(135deg,rgba(255,120,160,0.32),rgba(255,170,120,0.22));
        border-color:rgba(255,190,210,0.9); color:#fff;
        box-shadow:0 0 20px rgba(255,130,170,0.45), inset 0 0 12px rgba(255,180,200,0.15);
    }
    @media (max-width:680px){
        #switcher{ flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto; padding:4px 58px 10px 14px;
            -webkit-overflow-scrolling:touch; scrollbar-width:none; }
        #switcher::-webkit-scrollbar{ display:none; }
        .flower-btn{ padding:9px 16px; font-size:13.5px; }
        .tool-btn{ width:44px; height:44px; font-size:16px; }
        #toolbar{ gap:10px; top:10px; right:10px; }
        #fname{ font-size:15px; }
        #fhint{ font-size:8.5px; letter-spacing:1.2px; }
    }
    /* keep controls clear of notches / rounded corners */
    @supports(padding:max(0px)){
        #toolbar{ top:max(12px,env(safe-area-inset-top)); right:max(12px,env(safe-area-inset-right)); }
        #switcher{ padding-left:max(14px,env(safe-area-inset-left)); }
        #info{ bottom:max(16px,env(safe-area-inset-bottom)); }
    }

    /* toolbar */
    #toolbar{ position:absolute; top:12px; right:12px; z-index:30; display:flex; flex-direction:column; gap:8px; }
    .tool-btn{
        appearance:none; width:36px; height:36px; border-radius:50%;
        border:1px solid rgba(255,160,190,0.28); background:rgba(28,17,42,0.55);
        color:rgba(255,225,235,0.85); font-size:14px; line-height:1; cursor:pointer;
        backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
        transition:all .3s ease; display:flex; align-items:center; justify-content:center;
    }
    .tool-btn:hover{ border-color:rgba(255,170,200,0.8); box-shadow:0 0 12px rgba(255,130,170,0.3); }
    .tool-btn:focus-visible{ outline:2px solid rgba(255,190,210,0.9); outline-offset:2px; }
    .tool-btn.on{
        background:linear-gradient(135deg,rgba(255,120,160,0.35),rgba(255,170,120,0.25));
        border-color:rgba(255,190,210,0.95); color:#fff;
        box-shadow:0 0 16px rgba(255,130,170,0.5);
    }

    /* info card */
    #info{
        position:absolute; bottom:16px; left:0; right:0; z-index:10;
        display:flex; justify-content:center; pointer-events:none; transition:opacity .6s ease; padding:0 12px;
    }
    #infoCard{
        background:rgba(20,12,32,0.55); border:1px solid rgba(255,170,200,0.22);
        backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        border-radius:14px; padding:10px 24px 11px; text-align:center; max-width:92vw;
        box-shadow:0 4px 30px rgba(0,0,0,0.4), 0 0 26px rgba(255,130,170,0.09);
    }
    #fname{ font-family:Georgia,'Times New Roman',serif; font-size:16px; color:#ffeef4; letter-spacing:1px; }
    #fname .latin{ font-style:italic; font-size:12.5px; color:rgba(255,205,222,0.75); margin-left:8px; }
    #fdesc{ margin-top:3px; font-family:Georgia,serif; font-style:italic; font-size:12.5px;
        color:rgba(255,236,242,0.78); letter-spacing:0.3px; }
    #fhint{ margin-top:6px; font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:rgba(255,255,255,0.34); }

    /* hidden-UI mode for pure viewing */
    body.ui-hidden #title, body.ui-hidden #switcher, body.ui-hidden #info{ opacity:0; pointer-events:none; }
    body.ui-hidden .tool-btn{ opacity:0.16; }
    body.ui-hidden .tool-btn:hover{ opacity:1; }

    /* lightning */
    #flash{ position:absolute; inset:0; z-index:16; pointer-events:none; opacity:0;
        background:radial-gradient(circle at 50% 14%, rgba(238,242,255,0.95), rgba(184,202,255,0.4) 52%, rgba(0,0,0,0) 82%); }

    /* toast */
    #toast{ position:absolute; left:50%; bottom:88px; transform:translateX(-50%) translateY(8px); z-index:40;
        background:rgba(16,10,28,0.68); border:1px solid rgba(255,255,255,0.14);
        backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        color:rgba(255,242,250,0.94); font-size:12px; letter-spacing:1.6px;
        padding:8px 18px; border-radius:22px; pointer-events:none; white-space:nowrap;
        opacity:0; transition:opacity 0.45s ease, transform 0.45s ease; }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion:reduce){ #intro{ animation-duration:0.6s; } }
</style>
</head>
<body>
<canvas id="flowerCanvas"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="title"><h1><span class="tstar">✦</span>Enchanted Night Garden<span class="tstar">✦</span></h1></div>
<div id="switcher"></div>
<div id="toolbar">
    <button id="tourBtn"    class="tool-btn" title="Garden tour (space)">▶</button>
    <button id="diceBtn"    class="tool-btn" title="Surprise me">🎲</button>
    <button id="dreamBtn"   class="tool-btn" title="Dream a brand-new flower">✨</button>
    <button id="weatherBtn" class="tool-btn" title="Weather (W)">☾</button>
    <button id="photoBtn"   class="tool-btn" title="Save a photograph">📷</button>
    <button id="soundBtn"   class="tool-btn" title="Night sounds">♪</button>
    <button id="hideBtn"    class="tool-btn" title="Hide interface (H)">✧</button>
</div>
<div id="toast"></div>
<div id="info"><div id="infoCard">
    <div id="fname"></div>
    <div id="fdesc"></div>
    <div id="fhint"></div>
</div></div>
<div id="intro"><div class="star">✦</div><h2>Enchanted Night Garden</h2><p>a living bouquet</p></div>

<script>
(function () {
    'use strict';
    const canvas = document.getElementById('flowerCanvas');
    const infoEl = document.getElementById('info');
    let w = window.innerWidth, h = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1f);
    scene.fog = new THREE.FogExp2(0x0a0a1f, 0.0046);

    const camera = new THREE.PerspectiveCamera(44, w / h, 0.1, 200);
    camera.position.set(0, 1.8, 12);
    camera.lookAt(0, 0.8, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.86;

    // ---------------- Lighting ----------------
    const ambLight = new THREE.AmbientLight(0x4a3d5c, 0.58); scene.add(ambLight);
    const hemiLight = new THREE.HemisphereLight(0x8899ff, 0x2a1a3a, 0.34); scene.add(hemiLight);

    const mainLight = new THREE.DirectionalLight(0xffe8d8, 1.15);
    mainLight.position.set(-2.5, 6, 3.5);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.set(1024, 1024);
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 30;
    mainLight.shadow.bias = -0.0004;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xffb0a0, 0.42);
    fillLight.position.set(3, 2, -2);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffaa88, 0.85, 12);
    rimLight.position.set(0, 1.5, -2.5); scene.add(rimLight);
    const backRim = new THREE.PointLight(0xaabbff, 0.65, 14);
    backRim.position.set(0, 2.0, -3.8); scene.add(backRim);
    const movingLight = new THREE.PointLight(0xff88aa, 1.05, 10);
    scene.add(movingLight);
    const movingLight2 = new THREE.PointLight(0x88ccff, 0.75, 10);
    scene.add(movingLight2);
    const bottomGlow = new THREE.PointLight(0xff88aa, 0.55, 5);
    bottomGlow.position.set(0, -0.5, 0); scene.add(bottomGlow);
    const centerGlow = new THREE.PointLight(0xffbb88, 2.5, 5);
    centerGlow.position.set(0, 0.35, 0); scene.add(centerGlow);

    // ---------------- Glow sprite helper ----------------
    function makeGlowTexture(stops, size){
        size = size || 128;
        const c = document.createElement('canvas'); c.width = c.height = size;
        const x = c.getContext('2d');
        const g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
        stops.forEach(function(s){ g.addColorStop(s[0], s[1]); });
        x.fillStyle = g; x.fillRect(0, 0, size, size);
        return new THREE.CanvasTexture(c);
    }

    // ---------------- Sky dome (weather-aware; texture set by setWeather) ----------------
    const skyMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(95, 32, 24), skyMat));

    // ---------------- Moon ----------------
    const moonTex = makeGlowTexture([
        [0,'rgba(255,252,238,1)'],[0.27,'rgba(255,248,224,1)'],[0.33,'rgba(228,224,255,0.30)'],
        [0.6,'rgba(205,205,255,0.10)'],[1,'rgba(200,200,255,0)']], 256);
    const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, transparent: true, depthWrite: false, fog: false }));
    moon.position.set(-26, 18, -62); moon.scale.setScalar(18); scene.add(moon);
    const moonLight = new THREE.DirectionalLight(0xcfd6ff, 0.28);
    moonLight.position.set(-24, 17, -30); scene.add(moonLight);

    // ---------------- Flower halo (soft bloom fake) ----------------
    const haloTex = makeGlowTexture([
        [0,'rgba(255,255,255,0.5)'],[0.32,'rgba(255,255,255,0.16)'],[1,'rgba(255,255,255,0)']], 256);
    const haloMat = new THREE.SpriteMaterial({ map: haloTex, transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending, color: 0xffbb88, opacity: 0.42 });
    const halo = new THREE.Sprite(haloMat);
    halo.position.set(0, 0.55, -0.6); halo.scale.setScalar(7.5); scene.add(halo);

    // ---------------- Heart glint: golden starburst inside a violet ring ----------------
    function makeGlintTexture(){
        const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
        const x = c.getContext('2d');
        x.globalCompositeOperation = 'lighter';
        const C = S/2;
        function dot(px, py, r, a, col){
            if (r <= 0 || a <= 0) return;
            const g = x.createRadialGradient(px, py, 0, px, py, r);
            g.addColorStop(0, 'rgba('+col+','+a.toFixed(3)+')');
            g.addColorStop(1, 'rgba('+col+',0)');
            x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, Math.PI*2); x.fill();
        }
        // four long diffraction spikes (up/down/left/right)
        const spikes = [[1,0],[-1,0],[0,1],[0,-1]];
        for (let s = 0; s < spikes.length; s++){
            for (let i = 0; i <= 60; i++){
                const t = i/60, d = t*118;
                dot(C+spikes[s][0]*d, C+spikes[s][1]*d,
                    11*(1-t)+1.4, 0.34*Math.pow(1-t, 1.7), '255,206,132');
            }
        }
        // shorter 45° spikes for a jewelled cross
        const diag = [[0.707,0.707],[-0.707,0.707],[0.707,-0.707],[-0.707,-0.707]];
        for (let s = 0; s < diag.length; s++){
            for (let i = 0; i <= 40; i++){
                const t = i/40, d = t*62;
                dot(C+diag[s][0]*d, C+diag[s][1]*d,
                    7*(1-t)+1.2, 0.16*Math.pow(1-t, 1.8), '255,184,110');
            }
        }
        dot(C, C, 26, 0.45, '255,196,120');   // warm bloom around the core
        dot(C, C, 12, 0.9,  '255,240,214');   // white-hot centre
        dot(C, C, 5,  1.0,  '255,255,255');
        const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
    }
    function makeRingTexture(){
        const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
        const x = c.getContext('2d'); const C = S/2;
        const g = x.createRadialGradient(C, C, 0, C, C, C);
        g.addColorStop(0.00, 'rgba(190,120,255,0)');
        g.addColorStop(0.54, 'rgba(190,120,255,0)');
        g.addColorStop(0.64, 'rgba(206,146,255,0.30)');
        g.addColorStop(0.72, 'rgba(226,182,255,0.85)');   // bright rim
        g.addColorStop(0.80, 'rgba(196,128,255,0.28)');
        g.addColorStop(0.95, 'rgba(170,100,240,0.05)');
        g.addColorStop(1.00, 'rgba(170,100,240,0)');
        x.fillStyle = g; x.fillRect(0, 0, S, S);
        const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
    }
    const glintMat = new THREE.SpriteMaterial({ map: makeGlintTexture(), transparent: true,
        depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
        color: 0xffce96, opacity: 0.9 });
    const ringMat = new THREE.SpriteMaterial({ map: makeRingTexture(), transparent: true,
        depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
        color: 0xb478ff, opacity: 0.7 });
    const glintSprite = new THREE.Sprite(glintMat); glintSprite.renderOrder = 12;
    const ringSprite  = new THREE.Sprite(ringMat);  ringSprite.renderOrder = 11;
    const glintGroup = new THREE.Group();
    glintGroup.add(ringSprite); glintGroup.add(glintSprite);
    scene.add(glintGroup);
    const glintAnchor = new THREE.Vector3();

    // ---------------- Cinematic bloom (real post-processing) ----------------
    // Bright-pass -> separable gaussian at half res (x2 widening taps) -> composite.
    let renderFrame;
    (function(){
        try{
            const dbs = new THREE.Vector2(); renderer.getDrawingBufferSize(dbs);
            let W = Math.max(2, dbs.x), H = Math.max(2, dbs.y),
                BW = Math.max(2, Math.floor(W/2)), BH = Math.max(2, Math.floor(H/2));
            const parsA = { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
                            format:THREE.RGBAFormat, depthBuffer:true,  stencilBuffer:false };
            const parsB = { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
                            format:THREE.RGBAFormat, depthBuffer:false, stencilBuffer:false };
            const rtScene = new THREE.WebGLRenderTarget(W, H, parsA);
            const rtA = new THREE.WebGLRenderTarget(BW, BH, parsB);
            const rtB = new THREE.WebGLRenderTarget(BW, BH, parsB);
            const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const quadScene = new THREE.Scene();
            const quad = new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), null);
            quad.frustumCulled = false; quadScene.add(quad);
            const vsh = 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }';
            const brightMat = new THREE.ShaderMaterial({
                uniforms:{ tDiffuse:{value:null}, uThresh:{value:0.78} },
                vertexShader:vsh, fragmentShader:
                'uniform sampler2D tDiffuse; uniform float uThresh; varying vec2 vUv;\n'+
                'void main(){ vec4 c=texture2D(tDiffuse,vUv);\n'+
                '  float l=dot(c.rgb,vec3(0.2126,0.7152,0.0722));\n'+
                '  float f=smoothstep(uThresh,uThresh+0.42,l);\n'+
                '  gl_FragColor=vec4(c.rgb*f,1.0); }' });
            const blurMat = new THREE.ShaderMaterial({
                uniforms:{ tDiffuse:{value:null}, uDir:{value:new THREE.Vector2(1,0)} },
                vertexShader:vsh, fragmentShader:
                'uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;\n'+
                'void main(){ vec4 s=texture2D(tDiffuse,vUv)*0.227027;\n'+
                '  s+=texture2D(tDiffuse,vUv+uDir*1.3846)*0.3162162;\n'+
                '  s+=texture2D(tDiffuse,vUv-uDir*1.3846)*0.3162162;\n'+
                '  s+=texture2D(tDiffuse,vUv+uDir*3.2308)*0.0702703;\n'+
                '  s+=texture2D(tDiffuse,vUv-uDir*3.2308)*0.0702703;\n'+
                '  gl_FragColor=s; }' });
            const compMat = new THREE.ShaderMaterial({
                uniforms:{ tScene:{value:null}, tBloom:{value:null}, uStr:{value:0.38} },
                vertexShader:vsh, fragmentShader:
                'uniform sampler2D tScene; uniform sampler2D tBloom;\n'+
                'uniform float uStr; varying vec2 vUv;\n'+
                'void main(){\n'+
                '  vec3 c=texture2D(tScene,vUv).rgb;\n'+
                '  c+=texture2D(tBloom,vUv).rgb*uStr;\n'+
                // bloom is added after the renderer tone-maps, so it can overshoot 1.0
                // badly. This shoulder rolls highlights off smoothly instead of clipping
                // them to flat white.
                '  c=vec3(1.0)-exp(-max(c,vec3(0.0))*1.25);\n'+
                '  c=pow(c,vec3(0.4545));\n'+
                '  gl_FragColor=vec4(c,1.0); }' });
            function pass(mat, target){
                quad.material = mat;
                renderer.setRenderTarget(target);
                renderer.render(quadScene, quadCam);
            }
            renderFrame = function(){
                renderer.setRenderTarget(rtScene);
                renderer.render(scene, camera);
                brightMat.uniforms.tDiffuse.value = rtScene.texture;
                pass(brightMat, rtA);
                for(let i=0;i<2;i++){
                    const r = (i===0 ? 0.8 : 1.35);
                    blurMat.uniforms.tDiffuse.value = rtA.texture;
                    blurMat.uniforms.uDir.value.set(r/BW, 0); pass(blurMat, rtB);
                    blurMat.uniforms.tDiffuse.value = rtB.texture;
                    blurMat.uniforms.uDir.value.set(0, r/BH); pass(blurMat, rtA);
                }
                compMat.uniforms.tScene.value = rtScene.texture;
                compMat.uniforms.tBloom.value = rtA.texture;
                pass(compMat, null);
            };
            renderFrame.resize = function(){
                renderer.getDrawingBufferSize(dbs);
                W = Math.max(2, dbs.x); H = Math.max(2, dbs.y);
                BW = Math.max(2, Math.floor(W/2)); BH = Math.max(2, Math.floor(H/2));
                rtScene.setSize(W, H); rtA.setSize(BW, BH); rtB.setSize(BW, BH);
            };
        } catch(err){
            renderFrame = function(){ renderer.render(scene, camera); };
            renderFrame.resize = function(){};
        }
    })();

    // ---------------- Petal texture painter ----------------
    function makePetalTexture(cfg) {
        const cw = 128, ch = 256;
        const c = document.createElement('canvas'); c.width = cw; c.height = ch;
        const ctx = c.getContext('2d');

        const g = ctx.createLinearGradient(0, ch, 0, 0);
        g.addColorStop(0, cfg.base);
        g.addColorStop(cfg.midStop || 0.5, cfg.mid);
        g.addColorStop(1, cfg.tip);
        ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);

        // organic mottling: soft random blobs of light and shade
        const mAlpha = cfg.mottle !== undefined ? cfg.mottle : 0.05;
        if (mAlpha > 0) {
            for (let i = 0; i < 46; i++) {
                const bx = Math.random()*cw, by = Math.random()*ch, br = 8+Math.random()*22;
                const bg = ctx.createRadialGradient(bx,by,0,bx,by,br);
                const lite = Math.random() > 0.5;
                bg.addColorStop(0, lite ? 'rgba(255,255,255,'+mAlpha+')' : 'rgba(40,10,30,'+(mAlpha*0.8)+')');
                bg.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = bg;
                ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
            }
        }

        if (cfg.paleEdge !== false) {
            const edge = ctx.createLinearGradient(0, 0, cw, 0);
            edge.addColorStop(0, 'rgba(255,255,255,0.20)');
            edge.addColorStop(0.16, 'rgba(255,255,255,0)');
            edge.addColorStop(0.84, 'rgba(255,255,255,0)');
            edge.addColorStop(1, 'rgba(255,255,255,0.20)');
            ctx.fillStyle = edge; ctx.fillRect(0, 0, cw, ch);
        }

        ctx.strokeStyle = cfg.vein || 'rgba(255,255,255,0.07)';
        ctx.lineWidth = 1.1;
        for (let vI = 1; vI < 8; vI++) {
            const vx = (vI / 8) * cw;
            ctx.beginPath();
            ctx.moveTo(cw * 0.5, ch);
            ctx.quadraticCurveTo(vx, ch * 0.5, vx * 0.65 + cw * 0.175, 8);
            ctx.stroke();
        }

        if (cfg.midrib) {
            const rib = ctx.createLinearGradient(cw*0.44, 0, cw*0.56, 0);
            rib.addColorStop(0,'rgba(255,255,255,0)');
            rib.addColorStop(0.5,cfg.midrib);
            rib.addColorStop(1,'rgba(255,255,255,0)');
            ctx.fillStyle = rib; ctx.fillRect(0, 0, cw, ch);
        }

        // fanning colored stripes from the base (orchid lip / veined petals)
        if (cfg.stripes) {
            ctx.strokeStyle = 'rgba('+cfg.stripes.rgb+','+(cfg.stripes.alpha||0.25)+')';
            ctx.lineWidth = cfg.stripes.width || 2;
            const n = cfg.stripes.count || 9;
            for (let i = 0; i < n; i++) {
                const tx = cw*0.5 + (i-(n-1)/2)*(cw*0.75/n);
                ctx.beginPath();
                ctx.moveTo(cw*0.5, ch);
                ctx.quadraticCurveTo(cw*0.5+(tx-cw*0.5)*0.4, ch*0.62, tx, ch*(1-(cfg.stripes.len||0.62)));
                ctx.stroke();
            }
        }

        // dark wavy flame streaks rising from the base (tulip)
        if (cfg.flames) {
            ctx.strokeStyle = 'rgba('+cfg.flames.rgb+','+(cfg.flames.alpha||0.16)+')';
            for (let i = 0; i < (cfg.flames.count||5); i++) {
                ctx.lineWidth = 2.5+Math.random()*3.5;
                const fx = cw*(0.2+Math.random()*0.6);
                ctx.beginPath();
                ctx.moveTo(fx, ch);
                ctx.bezierCurveTo(fx+(Math.random()-0.5)*30, ch*0.7, fx+(Math.random()-0.5)*30, ch*0.5, fx+(Math.random()-0.5)*20, ch*0.28);
                ctx.stroke();
            }
        }

        if (cfg.freckles) {
            for (let i = 0; i < cfg.freckles; i++) {
                const fy = ch - Math.pow(Math.random(), 1.8) * ch * 0.55;
                const fx = cw * 0.5 + (Math.random() - 0.5) * cw * 0.5;
                const r = 1.3 + Math.random() * 2.4;
                ctx.fillStyle = 'rgba(' + cfg.freckleRGB + ',' + (0.30 + Math.random()*0.28).toFixed(2) + ')';
                ctx.beginPath();
                ctx.ellipse(fx, fy, r, r*0.7, Math.random()*Math.PI, 0, Math.PI*2);
                ctx.fill();
            }
        }

        const tex = new THREE.CanvasTexture(c);
        tex.anisotropy = 4;
        tex.encoding = THREE.sRGBEncoding;
        return tex;
    }

    // ---------------- Petal geometry ----------------
    function createPetalGeometry(o) {
        const len=o.len, maxWidth=o.maxWidth;
        const curl=o.curl||0, ruffle=o.ruffle||0, recurve=o.recurve||0,
              fold=o.fold||0, droop=o.droop||0, cup=o.cup||0,
              tipPinch=o.tipPinch||0, widthPow=o.widthPow||0.7, notch=o.notch||0,
              widthBias=o.widthBias||1;
        const segU=o.segU||48, segV=o.segV||32;
        const positions=[], uvs=[], indices=[];

        for (let i=0;i<=segU;i++){
            const u=i/segU;
            // widthBias moves the widest point off centre. The raw sine is
            // symmetric (widest at half height, pointed at both ends); a bias
            // above 1 pushes the shoulder up toward the tip, which narrows the
            // base and leaves a broad rounded blade -- a spoon, not a leaf.
            const uw=Math.pow(u,widthBias);
            let width=maxWidth*Math.pow(Math.sin(Math.PI*uw),widthPow);
            width*=(1 - tipPinch*Math.pow(u,3));
            for (let j=0;j<=segV;j++){
                const v=j/segV;
                const curlF   = curl*Math.sin(Math.PI*u)*len*0.22;
                const ruffleF = ruffle*Math.sin(Math.PI*v)*(v<0.5?-1:1)*Math.sin(2*Math.PI*u)*0.32;
                const foldF   = -fold*Math.abs(v-0.5)*2*Math.sin(Math.PI*u)*len*0.14;
                const cupF    = -cup*Math.pow(Math.sin(Math.PI*v),1.2)*Math.sin(Math.PI*u)*len*0.12;
                const recurveF= -recurve*Math.pow(u,2.8)*len*0.42;
                const droopF  = -droop*Math.pow(u,2)*len*0.30;
                const x=width*(v-0.5);
                const y=curlF+ruffleF+foldF+cupF+recurveF+droopF;
                // notch: a soft dip at the very tip center (cherry blossom)
                let z=len*u;
                if (notch>0) z -= notch*len*Math.pow(u,10)*Math.exp(-Math.pow((v-0.5)/0.16,2));
                positions.push(x,y,z); uvs.push(v,u);
            }
        }
        for (let i=0;i<segU;i++) for (let j=0;j<segV;j++){
            const a=i*(segV+1)+j,b=a+1,cc=a+(segV+1),d=cc+1;
            indices.push(a,b,d,a,d,cc);
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(positions),3));
        geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uvs),2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
    }

    // ---------------- State ----------------
    const flowerGroup = new THREE.Group();
    scene.add(flowerGroup);
    let petalItems=[], coreItems=[], coreGroup=null, disposables=[], bloomT=1,
        bloomDir=1, currentFlower='peony', ringCounter=0;
    function track(o){ disposables.push(o); return o; }
    function clearFlower(){
        while(flowerGroup.children.length) flowerGroup.remove(flowerGroup.children[0]);
        disposables.forEach(function(d){ if(d.dispose) d.dispose(); });
        disposables=[]; petalItems=[]; coreItems=[]; coreGroup=null; bloomT=0; ringCounter=0;
    }

    function addInnerSparkles(n, spreadXZ, spreadY, color) {
        const pos=new Float32Array(n*3);
        for(let i=0;i<n;i++){
            pos[i*3]=(Math.random()-0.5)*spreadXZ;
            pos[i*3+1]=(Math.random()-0.5)*spreadY+0.3;
            pos[i*3+2]=(Math.random()-0.5)*spreadXZ;
        }
        const geo=track(new THREE.BufferGeometry());
        geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
        coreGroup.add(new THREE.Points(geo, track(new THREE.PointsMaterial({
            size:0.03, color:color||0xffaa88, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
        }))));
    }

    function addRing(cfg) {
        const geo = track(createPetalGeometry(cfg.geo));
        const tex = cfg.texture;
        const thisRingPhase = ringCounter++;
        for (let i=0;i<cfg.count;i++){
            const angle=(i/cfg.count)*Math.PI*2 + (cfg.azOffset||0);
            const azimuthGroup=new THREE.Group(); azimuthGroup.rotation.y=angle;
            const elevationGroup=new THREE.Group();
            const elevation = cfg.elevStart + ((cfg.elevEnd!==undefined?cfg.elevEnd:cfg.elevStart)-cfg.elevStart)*(i/cfg.count);
            elevationGroup.rotation.x=-elevation*Math.PI/180;

            const mat=track(new THREE.MeshPhongMaterial({
                map:tex, color:0xffffff,
                emissive:new THREE.Color(cfg.emissive),
                emissiveIntensity:cfg.emissiveInt!==undefined?cfg.emissiveInt:0.2,
                shininess:cfg.shininess!==undefined?cfg.shininess:110, specular:0xffe6cc,
                transparent:true, opacity:cfg.opacity, side:THREE.DoubleSide
            }));
            const mesh=new THREE.Mesh(geo,mat);
            mesh.scale.setScalar((cfg.scale||1)*(0.92+Math.random()*(cfg.jitter!==undefined?cfg.jitter:0.16)));
            mesh.scale.x*=0.94+Math.random()*0.12;   // organic asymmetry
            mesh.rotation.z=(Math.random()-0.5)*0.07;
            mesh.castShadow=true; mesh.receiveShadow=true;
            elevationGroup.add(mesh); azimuthGroup.add(elevationGroup); flowerGroup.add(azimuthGroup);

            petalItems.push({
                group:elevationGroup, baseElevation:-elevation*Math.PI/180,
                windOffset:Math.random()*Math.PI*2, azimuthGroup:azimuthGroup,
                bloomOffset:angle, twist:cfg.twist!==false, twistAmt:cfg.twistAmt||0.9,
                flutter:cfg.flutter!==undefined?cfg.flutter:1, ringPhase:thisRingPhase
            });
        }
    }

    // ---------------- Stems and leaves ----------------
    const stemMat = new THREE.MeshPhongMaterial({ color:0x3a6b45, emissive:0x0a1c10, shininess:35 });
    const leafMat = new THREE.MeshPhongMaterial({ color:0x3f7a4e, emissive:0x0a1c10, shininess:40, side:THREE.DoubleSide });
    const twigMat = new THREE.MeshPhongMaterial({ color:0x5a3a2a, emissive:0x1a0f08, shininess:20 });

    function addStem(cfg){
        const pts = cfg.points.map(function(p){ return new THREE.Vector3(p[0],p[1],p[2]); });
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.Mesh(
            track(new THREE.TubeGeometry(curve, 32, cfg.radius||0.05, 8, false)),
            cfg.mat||stemMat
        );
        tube.castShadow = true;
        flowerGroup.add(tube);
        (cfg.leaves||[]).forEach(function(L){
            const lg = track(createPetalGeometry({len:L.len||1.5, maxWidth:L.width||0.45,
                curl:0.25, fold:0.4, tipPinch:0.5, widthPow:0.8, segU:24, segV:14}));
            const leaf = new THREE.Mesh(lg, leafMat);
            const p = curve.getPoint(L.t);
            leaf.position.copy(p);
            leaf.rotation.y = L.angle||0;
            leaf.rotation.x = -(L.tilt!==undefined?L.tilt:-0.9);
            leaf.castShadow = true;
            flowerGroup.add(leaf);
        });
        return curve;
    }
    function simpleStem(leafA, leafB){
        addStem({points:[[0,0.02,0],[0.05,-1.2,0.02],[-0.06,-2.4,-0.03],[0.02,-3.6,0]],
            radius:0.05,
            leaves:[{t:0.4, angle:leafA||0.7, len:1.7, width:0.5, tilt:-1.0},
                    {t:0.62, angle:(leafB!==undefined?leafB:3.6), len:1.5, width:0.45, tilt:-1.1}]});
    }

    function buildPeony(){
        const pal=[
            ['#ff9dba','#ffc2d6','#ffe9f1'],['#ff90b0','#ffb6cf','#ffe0ec'],
            ['#ff85a6','#ffabc6','#ffd7e6'],['#f9769a','#ff9fbc','#ffcfe0'],
            ['#f2648c','#ff8fac','#ffc4d8'],['#ea577f','#fb7f9c','#ffb8ce'],
            ['#e04870','#f2708f','#ffaec6']];
        const tex=pal.map(function(p){return track(makePetalTexture({base:p[0],mid:p[1],tip:p[2]}));});
        const rings=[
            [8,3.95,1.58,-0.71,0.80,82,9,0,0.42],[9,3.48,1.42,-0.52,0.66,80,14,0,0.47],
            [10,2.98,1.22,-0.26,0.54,78,26,1,0.55],[11,2.58,1.08,0.04,0.46,76,37,1,0.63],
            [12,2.18,0.92,0.40,0.36,74,51,2,0.70],[13,1.88,0.78,0.70,0.28,72,62,2,0.77],
            [14,1.54,0.66,1.00,0.22,70,71,3,0.83],[15,1.22,0.54,1.34,0.16,68,76,4,0.88],
            [17,0.94,0.44,1.58,0.12,66,80,5,0.92],[19,0.66,0.34,1.78,0.08,64,83,6,0.95],
            [16,0.52,0.28,1.92,0.05,60,86,6,0.97],[12,0.42,0.22,2.02,0.03,56,88,6,0.98]];
        rings.forEach(function(r){
            addRing({count:r[0],elevStart:r[5],elevEnd:r[6],opacity:r[8],
                emissive:pal[r[7]][0],emissiveInt:0.2,texture:tex[r[7]],
                twistAmt:0.9,jitter:0.28,flutter:1,
                geo:{len:r[1],maxWidth:r[2],curl:r[3],ruffle:r[4],cup:0.5}});
        });
        coreGroup=new THREE.Group(); flowerGroup.add(coreGroup);
        coreGroup.add(new THREE.Mesh(track(new THREE.SphereGeometry(0.34,32,32)),
            track(new THREE.MeshPhongMaterial({color:0xffd070,emissive:0xff5522,emissiveIntensity:0.85}))));
        const fGeo=track(new THREE.CylinderGeometry(0.016,0.024,0.65,6));
        const aGeo=track(new THREE.SphereGeometry(0.055,10,10));
        const fMat=track(new THREE.MeshPhongMaterial({color:0xffcc88,emissive:0x552200}));
        const aMat=track(new THREE.MeshPhongMaterial({color:0xffd24d,emissive:0xff7711,emissiveIntensity:0.9}));
        for(let i=0;i<220;i++){
            const angle=Math.random()*Math.PI*2, rad=0.40+Math.random()*0.36;

            const f=new THREE.Mesh(fGeo,fMat); f.position.set(x,y,z);
            f.rotation.z=Math.atan2(z,x); f.rotation.x=0.5+Math.random()*0.6;
            coreGroup.add(f);
            const a=new THREE.Mesh(aGeo,aMat);
            a.position.set(x+Math.cos(angle)*0.15,y+0.34,z+Math.sin(angle)*0.15);
            coreItems.push({mesh:a,phase:Math.random()*Math.PI*2,baseY:a.position.y,sway:0.02});
            coreGroup.add(a);

        addInnerSparkles(800,1.4,1.0,0xffcc88);

    function buildRose(){
        const pal=[
            ['#3f030d','#7c0c20','#b8253e'],['#4f0512','#8e1226','#c42f4c'],
            ['#620920','#a01a2e','#cf3a58'],['#780e28','#b4263e','#e04a6c'],
            ['#8e1634','#c4364c','#ee5f82'],['#a42040','#d44860','#f77898']];

            vein:'rgba(50,0,12,0.16)',mottle:0.06}));});
        const layers=[
            {count:5,len:0.9, wd:0.7, elev:8, cup:1.4, curl:1.9, ci:0},

    function buildDahlia(){
        // Ball dahlia (cafe-au-lait blush): a neat sphere with a flattened top,
        // every petal rolled inward into a tiny tube.
        const pal=[
            ['#e8946e','#f7bfa0','#fde9da'],['#ec9d7c','#f9c8ac','#fdece0'],
            ['#f0a88c','#fad2ba','#fef0e6'],['#f4b49c','#fcdcc8','#fef4ec']];
        const tex=pal.map(function(p){return track(makePetalTexture({base:p[0],mid:p[1],tip:p[2],
            midrib:'rgba(255,240,230,0.4)',mottle:0.04}));});
        const golden=2.39996, R=1.62;
        // Rings run from below the equator up to the crown. Petal length is very
        // nearly constant, so every tip lands on the same radius -- that is what
        // makes the head read as a ball instead of a cone. The old version shrank
        // length with height, which is why it tapered.
        const elevs=[-12,0,13,26,38,50,61,71,79,86];
        elevs.forEach(function(e,idx){
            // density follows cos(elevation), keeping the surface evenly covered
            const count=Math.max(5,Math.round(18*Math.cos(e*Math.PI/180)));
            // crown petals pull in slightly, flattening the top of the ball
            const len=R*(1-0.26*Math.max(0,(e-58)/32));
            const ci=idx<3?3:(idx<6?2:(idx<8?1:0));
            addRing({count:count,azOffset:idx*golden,elevStart:e,opacity:0.97,
                emissive:pal[ci][0],emissiveInt:0.16,shininess:55,
                texture:tex[ci],twistAmt:0.22,jitter:0.08,flutter:0.55,
                // high fold + cup with a pinched tip rolls each petal into a tube
                geo:{len:len,maxWidth:0.40,curl:0.46,cup:1.15,fold:1.9,tipPinch:0.62,
                     widthPow:1.0,segU:34,segV:18}});
        });
        coreGroup=new THREE.Group(); flowerGroup.add(coreGroup);
        // the centre is fully enclosed on a ball dahlia, so this is just a filler
        const bud=new THREE.Mesh(track(new THREE.SphereGeometry(0.16,16,16)),
            track(new THREE.MeshPhongMaterial({color:0xf4b49c,emissive:0xa05530,emissiveIntensity:0.25})));
        bud.position.y=0.10; bud.scale.y=0.85; coreGroup.add(bud);
        addInnerSparkles(600,1.0,0.7,0xffcfa8);
        simpleStem(0.5,3.2);

    function buildDicentra(){
        // bleeding heart: an arching stem with a row of pendant pink hearts
        coreGroup=new THREE.Group(); flowerGroup.add(coreGroup);
        const arch=new THREE.CatmullRomCurve3([
            new THREE.Vector3(-2.6,-0.9,0),new THREE.Vector3(-1.6,0.7,0.1),
            new THREE.Vector3(0,1.45,0),new THREE.Vector3(1.6,1.1,-0.1),
            new THREE.Vector3(2.7,0.4,0)]);
        const archMesh=new THREE.Mesh(track(new THREE.TubeGeometry(arch,48,0.035,8,false)),stemMat);
        archMesh.castShadow=true; coreGroup.add(archMesh);
        // leaves near the base of the arch
        [[0.06,0.9,2.0,0.8],[0.14,2.6,1.7,0.7]].forEach(function(L){
            const lg=track(createPetalGeometry({len:L[2],maxWidth:L[3],curl:0.3,fold:0.45,tipPinch:0.55,widthPow:0.75,segU:24,segV:14}));
            const leaf=new THREE.Mesh(lg,leafMat);
            leaf.position.copy(arch.getPoint(L[0]));
            leaf.rotation.y=L[1]; leaf.rotation.x=0.9; leaf.castShadow=true;
            coreGroup.add(leaf);
        });
        const pinkMat=track(new THREE.MeshPhongMaterial({color:0xff7fa8,emissive:0xa8305c,emissiveIntensity:0.22,shininess:115,specular:0xfff0f5}));
        const whiteMat=track(new THREE.MeshPhongMaterial({color:0xfff6f8,emissive:0xcc99aa,emissiveIntensity:0.15,shininess:120}));
        const lobeGeo=track(new THREE.SphereGeometry(0.24,18,18));
        const coneGeo=track(new THREE.ConeGeometry(0.215,0.36,16));
        const dropGeo=track(new THREE.SphereGeometry(0.075,12,12));
        const wingGeo=track(new THREE.ConeGeometry(0.05,0.17,10));
        const pedGeo=track(new THREE.CylinderGeometry(0.012,0.012,0.22,5));

        const ts=[0.3,0.45,0.6,0.74,0.87,0.97];
        ts.forEach(function(t,idx){
            const p=arch.getPoint(t);
            const s=1.05-idx*0.13;
            const hang=new THREE.Group(); hang.position.copy(p); coreGroup.add(hang);
            const ped=new THREE.Mesh(pedGeo,stemMat); ped.position.y=-0.11; hang.add(ped);
            const heart=new THREE.Group(); heart.position.y=-0.25-0.32*s; heart.scale.setScalar(s); hang.add(heart);
            const lL=new THREE.Mesh(lobeGeo,pinkMat); lL.position.set(-0.135,0.10,0); lL.scale.set(1,1.12,0.72); heart.add(lL);
            const lR=new THREE.Mesh(lobeGeo,pinkMat); lR.position.set(0.135,0.10,0); lR.scale.set(1,1.12,0.72); heart.add(lR);
            const body=new THREE.Mesh(coneGeo,pinkMat); body.rotation.x=Math.PI; body.position.y=-0.14; body.scale.z=0.72; heart.add(body);
            if(idx<5){
                const drop=new THREE.Mesh(dropGeo,whiteMat); drop.scale.set(1,1.9,1); drop.position.y=-0.42; heart.add(drop);
                for(let sgn=-1;sgn<=1;sgn+=2){

                    wg.position.set(0.075*sgn,-0.33,0);
                    wg.rotation.z=sgn*2.4; heart.add(wg);

    function buildSunflower(){
        // golden ray petals over a dark disc packed with a golden-angle seed spiral
        const petTex=track(makePetalTexture({base:'#e8920f',mid:'#ffc93c',tip:'#ffe27a',midStop:0.4,
            midrib:'rgba(180,90,0,0.35)',mottle:0.04,paleEdge:false}));
        const petTex2=track(makePetalTexture({base:'#d97f08',mid:'#f7b92e',tip:'#ffd75e',midStop:0.42,
            midrib:'rgba(160,80,0,0.35)',mottle:0.04,paleEdge:false}));
        const sepTex=track(makePetalTexture({base:'#274a22',mid:'#3f7038',tip:'#5c9450',mottle:0.05,paleEdge:false}));
        // Ray florets: lance-shaped blades set radially, like rays of light.
        // 21 + 13 = 34 rays, keeping the whole head on the Fibonacci sequence.
        addRing({count:21,elevStart:74,opacity:0.98,emissive:'#cc7a00',emissiveInt:0.22,shininess:40,
            texture:petTex,twist:false,jitter:0.08,flutter:0.7,
            geo:{len:2.75,maxWidth:0.66,curl:0.30,fold:0.42,tipPinch:0.60,widthPow:0.70,segU:36,segV:14}});
        addRing({count:13,azOffset:Math.PI/21,elevStart:64,opacity:0.97,emissive:'#b96e00',emissiveInt:0.2,shininess:40,
            texture:petTex2,twist:false,jitter:0.08,flutter:0.7,
            geo:{len:2.45,maxWidth:0.60,curl:0.34,fold:0.42,tipPinch:0.58,widthPow:0.70,segU:36,segV:14}});
        addRing({count:14,azOffset:0.3,elevStart:80,opacity:0.9,emissive:'#1a3a16',emissiveInt:0.12,shininess:30,
            texture:sepTex,twist:false,jitter:0.12,flutter:0.5,scale:0.85,
            geo:{len:1.7,maxWidth:0.42,curl:0.3,tipPinch:0.5,widthPow:0.9,segU:24,segV:10}});
        coreGroup=new THREE.Group(); flowerGroup.add(coreGroup);
        // Central disk: a flat, only slightly convex plate rather than a dome.
        const disc=new THREE.Mesh(track(new THREE.SphereGeometry(1.34,48,28)),
            track(new THREE.MeshPhongMaterial({color:0x4a2a10,emissive:0x1c0e04,shininess:18})));
        disc.scale.y=0.17; disc.position.y=0.06; coreGroup.add(disc);

        // Seed spirals: seating every seed one golden angle from the last is what
        // makes the interlocking left- and right-turning families appear on their
        // own -- at this density the dominant parastichies are the 34 / 55 pair.
        // Each seed is elongated and turned along its arm so the spirals read.
        const seedGeo=track(new THREE.SphereGeometry(0.046,8,8));
        const seedMatA=track(new THREE.MeshPhongMaterial({color:0x5c3417,emissive:0x241004,shininess:70}));
        const seedMatB=track(new THREE.MeshPhongMaterial({color:0x8a5a24,emissive:0x35200a,shininess:70}));
        const GA=Math.PI*(3-Math.sqrt(5));           // golden angle, ~137.5 degrees
        // Seed count scales with disk area so the packing density stays constant
        // as the centre grows -- otherwise a bigger disk just looks sparse.
        const SEEDS=580, RMAX=1.26;
        for(let i=0;i<SEEDS;i++){
            const r=RMAX*Math.sqrt((i+0.5)/SEEDS);   // sqrt keeps the packing even
            const a=i*GA, rn=r/RMAX;
            const s=new THREE.Mesh(seedGeo,(i%2)?seedMatA:seedMatB);
            s.position.set(Math.cos(a)*r, 0.31-0.15*rn*rn, Math.sin(a)*r);
            s.rotation.y=-a;                         // long axis follows the spiral
            s.scale.set(0.80,0.62,1.40);
            coreGroup.add(s);
        }

        // Disk florets: every "seed" is really a tiny tubular flower. A band of
        // them stands open across the outer disk, which is what gives the centre
        // its velvet texture instead of a bare plate.
        const florGeo=track(new THREE.CylinderGeometry(0.020,0.030,0.10,6));
        const florMat=track(new THREE.MeshPhongMaterial({color:0x7d4c1a,emissive:0x2c1707,shininess:40}));
        for(let i=0;i<190;i++){
            const r=RMAX*Math.sqrt(0.34+0.66*((i+0.5)/190));
            const a=i*GA, rn=r/RMAX;
            const fl=new THREE.Mesh(florGeo,florMat);
            fl.position.set(Math.cos(a)*r, 0.345-0.15*rn*rn, Math.sin(a)*r);
            coreGroup.add(fl);
        }
        const flMat=track(new THREE.MeshPhongMaterial({color:0xffcc44,emissive:0xcc8800,emissiveIntensity:0.6}));
        const flGeo=track(new THREE.SphereGeometry(0.035,8,8));
        // ring of open golden florets right at the disk rim
        for(let i=0;i<62;i++){ const a=(i/62)*Math.PI*2;
            const f=new THREE.Mesh(flGeo,flMat); f.position.set(Math.cos(a)*1.29,0.22,Math.sin(a)*1.29);
            coreItems.push({mesh:f,phase:i*0.4,baseY:0.22,sway:0.02}); coreGroup.add(f); }
        addInnerSparkles(600,2.4,0.8,0xffd870);
        addStem({points:[[0,0.02,0],[0.06,-1.2,0.04],[-0.05,-2.4,0],[0.02,-3.6,0]],radius:0.075,
            leaves:[{t:0.45,angle:1.0,len:2.4,width:1.1,tilt:-0.85},{t:0.65,angle:4.1,len:2.1,width:0.95,tilt:-0.95}]});
    }

    function buildMorningGlory(){

        tx.fillStyle=vg; tx.fillRect(0,0,512,256);
        for(let i=0;i<5;i++){

            const rg=tx.createLinearGradient(cx-30,0,cx+30,0);

    // Shared procedural builder. Both the random Dream flower and fixed entries

    function buildProcedural(p, glow){
        for(let L=0; L<p.layers; L++){
            const f=L/Math.max(1,p.layers-1);
            const hh=p.twoTone ? (L%2 ? p.h2 : p.h1) : p.h1+(p.h2-p.h1)*f*0.4;
            const tex=track(makePetalTexture({
                base:hsl(hh+8,p.sat,p.baseL), mid:hsl(hh,p.sat,p.midL),
                tip:hsl(hh-6,Math.max(30,p.sat-14),p.tipL),
                midStop:0.45, vein:'rgba(255,255,255,0.09)', mottle:0.05,
                freckles:(L===p.layers-1)?p.freckles:0, freckleRGB:p.freckleRGB||'120,30,60'
            }));
            const cnt=Math.max(4,p.baseCount-L);
            addRing({count:cnt, texture:tex,
                geo:{len:p.len*(1-0.16*L), maxWidth:p.wid*(1-0.1*L),
                     curl:p.curl+0.1*L, cup:p.cup, recurve:p.recurve*(L===0?1:0.4),
                     ruffle:p.ruffle, tipPinch:p.tipPinch, notch:p.notch,
                     widthPow:0.72, segU:34, segV:22},
                elevStart:p.elev-L*p.elevStep, azOffset:L*Math.PI/cnt,
                scale:1, opacity:0.97, emissive:p.emissive||'#331122', emissiveInt:0.22, jitter:0.14});
        }
        coreGroup=new THREE.Group(); flowerGroup.add(coreGroup);
        if(p.core==='orb'){
            const orb=new THREE.Mesh(track(new THREE.SphereGeometry(0.34,24,18)),
                track(new THREE.MeshPhongMaterial({color:0xfff4e0, emissive:glow,
                    emissiveIntensity:0.85, shininess:120})));
            orb.position.y=0.42; coreGroup.add(orb);
        } else if(p.core==='spiral'){
            const GA=Math.PI*(3-Math.sqrt(5));
            const sg=track(new THREE.SphereGeometry(0.05,8,6));
            const sm=track(new THREE.MeshPhongMaterial({color:0x2a1020, emissive:glow,
                emissiveIntensity:0.35, shininess:60}));
            for(let i=0;i<140;i++){
                const r=0.06+0.4*Math.sqrt(i/140), a=i*GA;
                const s=new THREE.Mesh(sg,sm);
                s.position.set(Math.cos(a)*r,0.34+Math.sin(i)*0.004,Math.sin(a)*r);
                s.scale.setScalar(0.5+0.7*Math.sqrt(i/140)); coreGroup.add(s);
            }
        } else {
            const fg=track(new THREE.CylinderGeometry(0.012,0.018,0.6,5));
            const fm=track(new THREE.MeshPhongMaterial({color:0xfff0c8, emissive:0x664411, shininess:80}));
            const ag=track(new THREE.SphereGeometry(0.05,8,6));
            const am=track(new THREE.MeshPhongMaterial({color:0xffe9a8, emissive:glow,
                emissiveIntensity:0.6}));
            for(let i=0;i<26;i++){
                const a=i/26*Math.PI*2, r=0.16+((i%3)*0.05);
                const st=new THREE.Mesh(fg,fm);
                st.position.set(Math.cos(a)*r,0.42,Math.sin(a)*r);
                st.rotation.z=Math.cos(a)*0.5; st.rotation.x=-Math.sin(a)*0.5; coreGroup.add(st);
                const an=new THREE.Mesh(ag,am);
                an.position.set(Math.cos(a)*(r+0.10),0.70,Math.sin(a)*(r+0.10)); coreGroup.add(an);
                if(i%4===0) coreItems.push({mesh:an, baseY:an.position.y, phase:a*2, sway:0.03});
            }
        }
        addInnerSparkles(60,1.1,0.8,glow);
        simpleStem(0.6+Math.random()*2, 2.8+Math.random()*2);
    }

    // ---------------- Stardust bursts ----------------
    const bursts=[];
    let burstFlash=0;
    function spawnBurst(strength){
        strength=strength||1;
        const F=FLOWERS[currentFlower];
        const n=Math.round(80*strength), pos=new Float32Array(n*3), vel=[];
        for(let i=0;i<n;i++){
            pos[i*3]=0; pos[i*3+1]=0.6; pos[i*3+2]=0;
            const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1),
                  sp=(1.5+Math.random()*2.6)*strength;
            vel.push(new THREE.Vector3(Math.sin(ph)*Math.cos(th)*sp,
                (Math.cos(ph)*0.7+0.55)*sp, Math.sin(ph)*Math.sin(th)*sp));
        }
        const g=new THREE.BufferGeometry();
        g.setAttribute('position',new THREE.BufferAttribute(pos,3));
        const m=new THREE.PointsMaterial({map:petalSprite,color:F.glow,size:0.14,
            transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
        const p=new THREE.Points(g,m); scene.add(p);
        bursts.push({p:p,g:g,m:m,vel:vel,life:0});
        burstFlash=Math.min(1.4,burstFlash+strength);
        chime(true);
    }
    function toggleBloom(){
        bloomDir = -bloomDir;
        if(bloomDir>0){                 // reopening — celebrate with stardust
            spawnBurst(0.8);
        } else {                        // closing — a softer inward chime
            burstFlash=Math.min(1.4,burstFlash+0.4);
            chime(true);
        }
        toast(bloomDir>0 ? '✿ blooming' : '❀ closing');
    }
    function updateBursts(dt){
        for(let i=bursts.length-1;i>=0;i--){
            const b=bursts[i]; b.life+=dt;
            const arr=b.g.attributes.position.array;
            for(let k=0;k<b.vel.length;k++){
                const v=b.vel[k];
                arr[k*3]+=v.x*dt; arr[k*3+1]+=v.y*dt; arr[k*3+2]+=v.z*dt;
                v.y-=2.1*dt; v.multiplyScalar(0.988);
            }
            b.g.attributes.position.needsUpdate=true;
            b.m.opacity=Math.max(0,1-b.life/1.5);
            if(b.life>1.5){ scene.remove(b.p); b.g.dispose(); b.m.dispose(); bursts.splice(i,1); }
        }

    // ---------------- Night chimes (generative, off by default) ----------------

    const mothGroup=new THREE.Group(); scene.add(mothGroup);
    const moths=[];
    (function(){
        // ---- wing painting -------------------------------------------------
        // canvas layout: left edge = hinge, right = tip, top = leading edge
        function tracePath(x,kind){
            x.beginPath();
            if(kind==='fore'){
                x.moveTo(6,54);
                x.bezierCurveTo(70,16, 168,8, 238,32);        // costal / leading edge
                x.bezierCurveTo(252,44, 248,64, 226,78);      // swept tip
                x.bezierCurveTo(190,100, 120,128, 46,128);    // trailing margin
                x.bezierCurveTo(22,128, 8,96, 6,54);
            } else {
                x.moveTo(8,40);
                x.bezierCurveTo(80,20, 158,38, 190,74);       // leading edge
                x.bezierCurveTo(214,98, 204,124, 180,138);    // outer lobe
                x.bezierCurveTo(196,168, 180,214, 156,244);   // long streaming tail
                x.bezierCurveTo(150,252, 140,248, 140,232);
                x.bezierCurveTo(146,190, 142,152, 120,132);   // back up the inner tail edge
                x.bezierCurveTo(80,126, 26,104, 8,40);
            }
            x.closePath();
        }
        function traceCostal(x,kind){
            x.beginPath();
            if(kind==='fore'){ x.moveTo(6,54); x.bezierCurveTo(70,16, 168,8, 238,32); }
            else { x.moveTo(8,40); x.bezierCurveTo(80,20, 158,38, 190,74); }
        }
        function eyespot(x,cx,cy,rx,ry,rot){
            x.save(); x.translate(cx,cy); x.rotate(rot);
            x.fillStyle='rgba(40,44,96,0.60)';
            x.beginPath(); x.ellipse(0,0,rx,ry,0,0,Math.PI*2); x.fill();
            x.fillStyle='rgba(196,214,255,0.42)';
            x.beginPath(); x.ellipse(0,0,rx*0.74,ry*0.74,0,0,Math.PI*2); x.fill();
            x.fillStyle='rgba(240,246,255,0.65)';
            x.beginPath(); x.ellipse(-rx*0.08,-ry*0.10,rx*0.42,ry*0.42,0,0,Math.PI*2); x.fill();
            x.globalCompositeOperation='destination-out';   // translucent window
            x.fillStyle='rgba(0,0,0,0.42)';
            x.beginPath(); x.ellipse(-rx*0.08,-ry*0.10,rx*0.34,ry*0.34,0,0,Math.PI*2); x.fill();
            x.globalCompositeOperation='source-over';
            x.restore();
        }
        function paintWing(kind){
            const CW=256, CH=(kind==='fore')?176:256;
            const c=document.createElement('canvas'); c.width=CW; c.height=CH;
            const x=c.getContext('2d');

            // 1. downy outer fuzz, drawn first so it sits behind the membrane
            x.save();
            tracePath(x,kind);
            x.shadowColor='rgba(188,214,255,0.8)'; x.shadowBlur=11;
            x.strokeStyle='rgba(188,214,255,0.45)'; x.lineWidth=3.5; x.stroke();
            x.restore();

            // 2. membrane
            tracePath(x,kind);
            const g=x.createLinearGradient(0,CH*0.22,CW,CH*0.86);
            g.addColorStop(0,'#f2f7ff'); g.addColorStop(0.30,'#cdddf8');
            g.addColorStop(0.68,'#9fbef0'); g.addColorStop(1,'#6f92da');
            x.fillStyle=g; x.fill();

            // 3. interior detail, clipped to the wing
            x.save(); tracePath(x,kind); x.clip();

            const sheen=x.createLinearGradient(CW*0.15,0,CW*0.95,CH);
            sheen.addColorStop(0,'rgba(255,255,255,0)');
            sheen.addColorStop(0.42,'rgba(210,232,255,0.30)');
            sheen.addColorStop(0.60,'rgba(170,205,255,0.18)');
            sheen.addColorStop(1,'rgba(255,255,255,0)');
            x.fillStyle=sheen; x.fillRect(0,0,CW,CH);

            traceCostal(x,kind);                       // dark indigo leading-edge margin
            x.strokeStyle='rgba(48,58,120,0.62)'; x.lineWidth=11; x.lineCap='round'; x.stroke();
            traceCostal(x,kind);
            x.strokeStyle='rgba(96,116,180,0.34)'; x.lineWidth=4; x.stroke();

            x.strokeStyle='rgba(70,104,168,0.28)'; x.lineWidth=1.6;
            const hinge = kind==='fore' ? [10,66] : [12,58];
            const tips  = kind==='fore' ? [[228,40],[224,66],[196,94],[140,118],[70,124]]
                                        : [[184,80],[176,116],[152,138],[146,196],[86,120]];
            for(let i=0;i<tips.length;i++){
                x.beginPath(); x.moveTo(hinge[0],hinge[1]);
                x.quadraticCurveTo(CW*0.42,hinge[1]-6,tips[i][0],tips[i][1]); x.stroke();
            }

            for(let i=0;i<70;i++){                     // powdery scales
                const sx=Math.random()*CW, sy=Math.random()*CH, sr=1+Math.random()*3.2;
                x.fillStyle=Math.random()<0.5?'rgba(255,255,255,0.10)':'rgba(110,140,205,0.10)';
                x.beginPath(); x.arc(sx,sy,sr,0,Math.PI*2); x.fill();
            }

            if(kind==='fore') eyespot(x,178,52,13,8.5,-0.34);
            else              eyespot(x,132,88,15,10,0.30);

            x.restore();

            // 4. crisp rim
            tracePath(x,kind);
            x.strokeStyle='rgba(66,122,96,0.5)'; x.lineWidth=2; x.stroke();

            const t=new THREE.CanvasTexture(c);
            t.encoding=THREE.sRGBEncoding; t.flipY=false; t.anisotropy=4;
            return t;
        }

        // ---- cambered wing surface ----------------------------------------
        // side = +1 builds a right wing (spans +X), -1 a true mirror (spans -X).
        // Mirroring the geometry keeps the leading edge at +Z on BOTH sides;
        // spinning a pivot 180 degrees would flip Z too and fly the wing backwards.
        function wingGeo(len,chord,zOff,camber,side){
            const g=new THREE.PlaneBufferGeometry(len,chord,12,8);
            g.rotateX(-Math.PI/2);                       // lie flat, span along X
            g.translate(side*len/2,0,zOff);              // hinge at the body
            const p=g.attributes.position;
            for(let i=0;i<p.count;i++){
                const s=Math.abs(p.getX(i))/len;         // 0 hinge -> 1 tip
                const cz=(p.getZ(i)-zOff)/chord;         // +0.5 leading, -0.5 trailing
                p.setY(i, -camber*s*s + camber*0.34*Math.sin(Math.PI*s) - cz*0.09*s*len);
            }
            p.needsUpdate=true;
            if(side<0){                                   // flip u so the paint mirrors too
                const uv=g.attributes.uv;
                for(let i=0;i<uv.count;i++) uv.setX(i,1-uv.getX(i));
                uv.needsUpdate=true;
            }
            g.computeVertexNormals();
            return g;
        }
        const FL=0.95, FC=FL*176/256, HL=0.74, HC=HL;
        const foreGeoR=wingGeo(FL,FC, 0.13,0.085, 1), foreGeoL=wingGeo(FL,FC, 0.13,0.085,-1);
        const hindGeoR=wingGeo(HL,HC,-0.21,0.070, 1), hindGeoL=wingGeo(HL,HC,-0.21,0.070,-1);
        const foreTex=paintWing('fore'), hindTex=paintWing('hind');
        function wingMat(tex){
            return new THREE.MeshPhongMaterial({map:tex, emissive:0x1f2f5c, emissiveMap:tex,
                emissiveIntensity:0.55, transparent:true, depthWrite:false,
                side:THREE.DoubleSide, shininess:16, specular:0x335544});
        }

        // ---- body ----------------------------------------------------------
        // furry pale-green body: tapered segmented abdomen, plump thorax, small head.
        const bodyMat=new THREE.MeshPhongMaterial({color:0xd8e2f6,emissive:0x242f48,shininess:14});
        const fuzzMat=new THREE.MeshPhongMaterial({color:0xe8effb,emissive:0x2e3a54,
            shininess:4, transparent:true, opacity:0.55});
        const antMat=new THREE.MeshPhongMaterial({color:0x7a5a2e,emissive:0x2c1e0c,shininess:8});
        const eyeMat=new THREE.MeshPhongMaterial({color:0x120a18,emissive:0x060309,shininess:60});

        // segmented abdomen: five tapering rings so it reads as a real insect gaster
        const abdSegGeo=[];
        for(let s=0;s<5;s++){
            const r=0.052-s*0.008;
            abdSegGeo.push(new THREE.SphereGeometry(r,8,6));
        }
        const thoraxGeo=new THREE.SphereGeometry(0.058,12,10);
        const collarGeo=new THREE.SphereGeometry(0.05,10,8);
        const headGeo=new THREE.SphereGeometry(0.032,8,6);
        const eyeGeo=new THREE.SphereGeometry(0.014,6,6);
        const fuzzGeo=new THREE.SphereGeometry(0.05,8,6);

        function buildAntenna(side){
            const grp=new THREE.Group();
            const shaft=new THREE.CatmullRomCurve3([
                new THREE.Vector3(0,0,0),             new THREE.Vector3(0.05*side,0.03,0.06),
                new THREE.Vector3(0.11*side,0.05,0.12), new THREE.Vector3(0.17*side,0.045,0.17)
            ]);
            grp.add(new THREE.Mesh(new THREE.TubeGeometry(shaft,14,0.007,5,false),antMat));
            const N=8;
            for(let i=1;i<=N;i++){
                const t=i/(N+1), base=shaft.getPoint(t), tan=shaft.getTangent(t);
                const perp=new THREE.Vector3(-tan.z,0,tan.x).normalize();
                const teethLen=0.058*(1-t*0.5);
                for(const dir of [1,-1]){
                    const tip=base.clone().add(perp.clone().multiplyScalar(dir*teethLen))
                                          .add(new THREE.Vector3(0,0.003,0));
                    const seg=new THREE.CatmullRomCurve3([base.clone(),base.clone().lerp(tip,0.55),tip]);
                    grp.add(new THREE.Mesh(new THREE.TubeGeometry(seg,3,0.0022,4,false),antMat));
                }
            }
            return grp;
        }

        const gTex=makeGlowTexture([[0,'rgba(200,220,255,0.45)'],[0.4,'rgba(150,185,255,0.14)'],
            [1,'rgba(120,160,255,0)']],128);

        for(let i=0;i<4;i++){
            const g=new THREE.Group();

            const body=new THREE.Group();
            // abdomen segments marching back from the thorax, tapering and dipping
            for(let s=0;s<abdSegGeo.length;s++){
                const seg=new THREE.Mesh(abdSegGeo[s],bodyMat);
                seg.position.set(0,-0.004*s,-0.05-s*0.052);
                seg.scale.z=1.25;
                body.add(seg);
            }
            const thx=new THREE.Mesh(thoraxGeo,bodyMat); thx.position.set(0,0.006,0.03);
            thx.scale.set(1.05,0.95,1.15); body.add(thx);
            const collar=new THREE.Mesh(collarGeo,bodyMat); collar.position.set(0,0.004,0.085);
            collar.scale.set(1,0.8,0.8); body.add(collar);
            // downy fuzz over the thorax — a couple of soft translucent shells
            const f1=new THREE.Mesh(fuzzGeo,fuzzMat); f1.position.set(0,0.012,0.04);
            f1.scale.set(1.35,1.15,1.5); body.add(f1);
            const head=new THREE.Mesh(headGeo,bodyMat); head.position.set(0,0.006,0.125); body.add(head);
            const eR=new THREE.Mesh(eyeGeo,eyeMat); eR.position.set(0.02,0.006,0.14); body.add(eR);
            const eL=new THREE.Mesh(eyeGeo,eyeMat); eL.position.set(-0.02,0.006,0.14); body.add(eL);
            const aR=buildAntenna(1);  aR.position.set(0.012,0.02,0.145); body.add(aR);
            const aL=buildAntenna(-1); aL.position.set(-0.012,0.02,0.145); body.add(aL);
            g.add(body);

            // one pivot per wing so the hindwings can lag behind the forewings
            const mf=wingMat(foreTex), mh=wingMat(hindTex);
            const tint=0.58+Math.random()*0.10, lum=0.82+Math.random()*0.12;
            mf.color.setHSL(tint,0.42,lum); mh.color.copy(mf.color);

            const pFR=new THREE.Group(), pFL=new THREE.Group();
            const pHR=new THREE.Group(), pHL=new THREE.Group();
            const fwR=new THREE.Mesh(foreGeoR,mf), fwL=new THREE.Mesh(foreGeoL,mf);
            const hwR=new THREE.Mesh(hindGeoR,mh), hwL=new THREE.Mesh(hindGeoL,mh);
            pFR.add(fwR); pFL.add(fwL); pHR.add(hwR); pHL.add(hwL);
            g.add(pFR); g.add(pFL); g.add(pHR); g.add(pHL);

            const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:gTex,transparent:true,
                depthWrite:false,blending:THREE.AdditiveBlending,opacity:0.16}));
            gl.scale.setScalar(0.7); g.add(gl);

            g.scale.setScalar(0.55+Math.random()*0.25);
            mothGroup.add(g);
            moths.push({g:g, body:body, pFR:pFR, pFL:pFL, pHR:pHR, pHL:pHL,
                fwR:fwR, fwL:fwL, hwR:hwR, hwL:hwL, mf:mf, mh:mh, baseTint:tint,
                t0:Math.random()*100, spd:0.16+Math.random()*0.12,
                r:3.5+Math.random()*2.2, h:0.8+Math.random()*1.6,

        }
    })();
    // recolor moth wings to harmonize with the current flower; each moth keeps
    // a little of its own hue so the flock doesn't look uniform.
    const _mothCol=new THREE.Color(), _mothHSL={h:0,s:0,l:0};
    function tintMoths(hexColor){
        _mothCol.set(hexColor); _mothCol.getHSL(_mothHSL);
        for(let i=0;i<moths.length;i++){
            const mo=moths[i];
            if(!mo.mf) continue;
            // blend flower hue with the moth's own base tint; lift luminance so wings stay luminous
            const h=(_mothHSL.h + (mo.baseTint-0.58)*0.35 + 1)%1;
            const s=Math.min(0.6, 0.30+_mothHSL.s*0.5);
            const l=0.66+ (i%3)*0.05;
            mo.mf.color.setHSL(h,s,l); mo.mh.color.copy(mo.mf.color);
            const em=new THREE.Color().setHSL(h,Math.min(0.7,s+0.15),0.22);
            mo.mf.emissive.copy(em); mo.mh.emissive.copy(em);
        }
    }
    function updateMoths(ts){
        if(!mothGroup.visible) return;
        for(let i=0;i<moths.length;i++){
            const mo=moths[i], ang=mo.t0+ts*mo.spd;
            const wob=Math.sin(ts*0.33+mo.t0)*0.8;
            const ny=mo.h+Math.sin(ts*0.8+mo.t0*2)*0.55+Math.sin(ts*2.1+mo.t0)*0.1;
            mo.g.position.set(Math.cos(ang)*mo.r+wob, ny, Math.sin(ang)*mo.r*0.8);
            const a2=ang+0.14;
            mo.g.lookAt(Math.cos(a2)*mo.r+wob, ny+Math.sin(ts*0.8+mo.t0*2)*0.06, Math.sin(a2)*mo.r*0.8);

            // wingbeat: time-warped so the downstroke snaps and the recovery drifts
            const ph=ts*mo.fl+mo.t0*3;
            const warp=ph+0.45*Math.sin(ph);
            const flap=Math.sin(warp), hind=Math.sin(warp-0.55);
            const foreA=0.42+flap*0.90, hindA=0.30+hind*0.70;
            mo.pFR.rotation.z= foreA; mo.pFL.rotation.z=-foreA;   // mirrored spans, mirrored lift
            mo.pHR.rotation.z= hindA; mo.pHL.rotation.z=-hindA;
            const twist=Math.cos(warp)*0.30;            // feathering through the stroke
            mo.fwR.rotation.x=twist;      mo.fwL.rotation.x=twist;
            mo.hwR.rotation.x=twist*0.65; mo.hwL.rotation.x=twist*0.65;
            mo.body.position.y=-flap*0.022;             // body bobs against the beat
            mo.g.rotateZ(mo.bank+Math.sin(ts*0.6+mo.t0)*0.12);   // bank into the turn
        }
    }

    // =====================================================================

    const snowCount=260, snowVel=new Float32Array(snowCount);

    (function(){
        const p=new Float32Array(snowCount*3);
        for(let i=0;i<snowCount;i++){
            p[i*3]=-20+Math.random()*40; p[i*3+1]=-4+Math.random()*24; p[i*3+2]=-20+Math.random()*18;

    function makeSkyTexture(mood){
        const sc=document.createElement('canvas'); sc.width=512; sc.height=1024;
        const sx=sc.getContext('2d');
        const stopsMap={
            midnight:['#04030d','#0a0922','#191036','#2c1440','#3a1a40'],
            aurora:  ['#020610','#05101f','#0a1e30','#103041','#0d2a36'],
            snow:    ['#070a16','#0d1326','#161f38','#212e4c','#2a3a5c'],
            rain:    ['#04050a','#090c13','#10141d','#171b26','#1e222e']
        };
        const st=stopsMap[mood]||stopsMap.midnight;
        const sg=sx.createLinearGradient(0,0,0,1024);
        sg.addColorStop(0,st[0]); sg.addColorStop(0.42,st[1]); sg.addColorStop(0.72,st[2]);
        sg.addColorStop(0.9,st[3]); sg.addColorStop(1,st[4]);
        sx.fillStyle=sg; sx.fillRect(0,0,512,1024);
        if(mood!=='rain'){
            const hueSet= mood==='aurora'?['60,190,160','80,120,200']
                       : mood==='snow'  ?['150,170,220','120,140,200']
                       : ['170,90,210','90,100,220'];
            const nN=mood==='snow'?16:30;
            for(let i=0;i<nN;i++){
                const nx=Math.random()*512, ny=160+Math.random()*680, nr=60+Math.random()*150;

                ng.addColorStop(0,'rgba('+hueSet[i%2]+',0.055)'); ng.addColorStop(1,'rgba(0,0,0,0)');
                sx.fillStyle=ng; sx.beginPath(); sx.arc(nx,ny,nr,0,Math.PI*2); sx.fill();
            }
        } else {
            for(let i=0;i<14;i++){   // heavy cloud bellies
                const cy=120+Math.random()*500, cxp=Math.random()*512, cw2=120+Math.random()*200;
                const cg=sx.createRadialGradient(cxp,cy,0,cxp,cy,cw2);

            }

    // ---------------- Animate ----------------
    let lastNow=performance.now(), chimeAcc=0;
    function animate(){
        requestAnimationFrame(animate);
        const nowMs=performance.now();
        let dtReal=(nowMs-lastNow)/1000; lastNow=nowMs;
        if(dtReal>0.1) dtReal=0.1;
        time+=0.012;

        const F=FLOWERS[currentFlower], m=F.motion||{};

        bloomT=Math.max(0,Math.min(1, bloomT + bloomDir*(bloomDir>0?0.022:0.030)));
        // ease out when opening, ease in when closing — feels like it relaxes shut
        const bloomEase = bloomDir>0 ? 1-Math.pow(1-bloomT,3) : bloomT*bloomT*(3-2*bloomT);

        const breath=0.5+0.5*Math.sin(time*0.18);
        const dynamicOpen=(F.open+breath*0.08)*(0.4+0.6*bloomEase);
        const dynamicBloom=(0.4+breath*0.14)*bloomEase;

        for(let k=0;k<petalItems.length;k++){
            const p=petalItems[k];
            let flutter=(Math.sin(time*1.6+p.windOffset)*0.012*p.flutter
                      + Math.sin(time*3.1+p.windOffset*1.7)*0.005*p.flutter)*(1+windKick*2.6);
            if(m.ripple){
                const phase = m.byRing ? -p.ringPhase*1.3 : p.windOffset*(m.windF||1);
                flutter += m.ripple*Math.sin(time*(m.rippleS||0.8)+phase);
            }
            p.group.rotation.x=p.baseElevation*(1-dynamicOpen)+flutter;
            const wy=Math.sin(time*0.55+p.windOffset*1.2)*0.009;
            p.azimuthGroup.rotation.z=wy*0.6+Math.sin(time*0.9+p.windOffset)*0.005;
            p.azimuthGroup.rotation.x=wy*0.4;
            if(p.twist) p.azimuthGroup.rotation.y=p.bloomOffset+dynamicBloom*p.twistAmt*Math.sin(p.bloomOffset);
        }

        const shim=m.shimmer||1;
        for(let k=0;k<coreItems.length;k++){
            const c=coreItems[k];
            if(c.type==='pend'){
                c.group.rotation.z=Math.sin(time*1.05+c.phase)*c.amp;
                c.group.rotation.x=Math.cos(time*0.85+c.phase*1.3)*c.amp*0.55;
            } else {
                c.mesh.position.y=c.baseY+Math.sin(time*2.2*shim+c.phase)*(c.sway||0.02);
                if(c.baseRotZ!==undefined) c.mesh.rotation.z=c.baseRotZ+Math.sin(time*1.7+c.phase)*0.06*shim;
            }
        }

        if(coreGroup){
            if(currentFlower!=='dicentra') coreGroup.rotation.y=time*0.05;
            coreGroup.scale.setScalar(0.2+0.8*bloomEase);
            if(m.podPulse) coreGroup.scale.multiplyScalar(1+0.03*Math.sin(time*1.1));
        }

        const tiltX=(m.nx||0)*Math.sin(time*(m.nxs||0.5));
        const tiltZ=(m.nz||0)*Math.cos(time*(m.nzs||0.42));
        const bob=(m.bob||0)*Math.sin(time*(m.bobs||0.6));
        const pulse=1+(m.pulse||0)*Math.sin(time*(m.pulses||0.6));

        if(!dragging){ idle+=1; if(idle>200) rotY+=0.0011; }
        flowerGroup.rotation.y=rotY;
        flowerGroup.rotation.x=rotX+tiltX;
        flowerGroup.rotation.z=tiltZ;
        flowerGroup.position.y=bob;
        flowerGroup.scale.setScalar((1+0.012*Math.sin(time*1.1))*(0.55+0.45*bloomEase)*pulse);

        const gb=F.glowBoost||1;
        centerGlow.intensity=(2.4+1.0*Math.sin(time*1.25))*gb+burstFlash*3;
        burstFlash*=0.94;
        rimLight.intensity=0.8+0.3*Math.sin(time*1.4);
        backRim.intensity=0.55+0.25*Math.sin(time*1.7);
        movingLight.position.set(1.4*Math.sin(time*0.7),1.5,1.1*Math.cos(time*0.55));
        movingLight.intensity=0.95+0.5*Math.sin(time*1.9);
        movingLight2.position.set(-1.4*Math.cos(time*0.5),1.0,1.2*Math.sin(time*0.62));
        movingLight2.intensity=0.65+0.35*Math.sin(time*1.5);
        bottomGlow.intensity=0.5+0.3*Math.sin(time*1.2);

        const pp=fpGeo.attributes.position.array;
        for(let i=0;i<fpCount;i++){
            const idx=i*3, rad=Math.hypot(pp[idx],pp[idx+2]);
            const ang=Math.atan2(pp[idx+2],pp[idx])+0.0009*fpVel[i];
            pp[idx]=Math.cos(ang)*rad; pp[idx+2]=Math.sin(ang)*rad;
            pp[idx+1]-=0.0016*fpVel[i]+0.0006;
            pp[idx+1]+=Math.sin(time*1.3+i)*0.0009;
            pp[idx]+=windKick*0.05;
            if(pp[idx+1]<-1.8){ pp[idx+1]=3.4; }
        }
        fpGeo.attributes.position.needsUpdate=true;

        glitter.rotation.y+=0.0018; glitter.rotation.x=Math.sin(time*0.3)*0.09;
        glitter.material.opacity=0.75+0.25*Math.sin(time*2.0);
        pollen.rotation.y-=0.001; pollen.rotation.x=Math.cos(time*0.28)*0.07;
        dust.rotation.y+=0.0012; dust.rotation.x=Math.sin(time*0.4)*0.06;
        stars.rotation.y+=0.0004; starMat.size=0.09+Math.sin(time*1.5)*0.015;

        // fireflies wander and blink
        for(let i=0;i<fireflies.length;i++){
            const f=fireflies[i];
            f.s.position.set(
                f.cx+Math.sin(time*f.fx+f.p1)*f.ax,
                f.cy+Math.sin(time*f.fy+f.p2)*f.ay,
                f.cz+Math.cos(time*f.fz+f.p3)*f.az);
            const bl=Math.max(0,Math.sin(time*f.bf+f.bp));
            f.m.opacity=(0.06+Math.pow(bl,3)*0.85)*fireflyMul;
            f.s.scale.setScalar(f.sc*(0.7+0.5*bl));
        }

        // mist drifts
        for(let i=0;i<mists.length;i++){
            const mm=mists[i];
            mm.m.position.x=Math.sin(time*mm.sp+mm.ph)*3.2;
            mm.m.material.opacity=0.14+0.06*Math.sin(time*0.35+mm.ph);
        }

        // grass sways
        for(let i=0;i<blades.length;i++){
            const bb=blades[i];
            bb.m.rotation.z=bb.base+Math.sin(time*0.9+bb.ph)*bb.amp*(1+windKick*2.5)-windKick*0.15;
        }

        // shooting stars
        for(let i=0;i<shooters.length;i++){
            const sh=shooters[i];
            if(sh.t>=1){
                sh.wait-=dtReal;
                if(sh.wait<=0){ if(weatherNow!=='rain') launchShooter(sh); sh.wait=6+Math.random()*10; }
            } else {
                sh.t+=dtReal/sh.dur;
                const tt=Math.min(1,sh.t);
                sh.s.position.set(sh.x0+sh.dx*tt, sh.y0+sh.dy*tt, sh.z);
                sh.m.opacity=Math.sin(Math.PI*tt)*0.9;
            }
        }

        updateBursts(dtReal);

        tSec+=dtReal;
        updateMoths(tSec);
        updateWeather(dtReal,tSec);
        windKick*=Math.exp(-dtReal*1.7);

        // heart glint rides the flower's core
        flowerGroup.updateMatrixWorld(true);
        glintAnchor.set(0, 0.5, 0).applyMatrix4(flowerGroup.matrixWorld);
        glintGroup.position.copy(glintAnchor);
        const gp = 0.5 + 0.5*Math.sin(time*1.5);
        const gs = flowerGroup.scale.x;
        glintSprite.scale.setScalar((2.5 + 0.55*gp + burstFlash*1.6) * gs);
        glintMat.opacity = (0.34 + 0.24*gp) * bloomEase;
        glintMat.rotation = time*0.07;
        ringSprite.scale.setScalar((2.05 + 0.14*Math.sin(time*0.85)) * gs);
        ringMat.opacity = (0.30 + 0.13*Math.sin(time*1.05)) * bloomEase;
        ringMat.rotation = -time*0.04;

        // flower halo breathes with its bloom
        haloMat.opacity=(0.17+0.06*Math.sin(time*1.1))*(F.glowBoost||1)*(0.4+0.6*bloomEase)+burstFlash*0.16;
        halo.scale.setScalar(7.2+0.6*Math.sin(time*0.9)+burstFlash*1.2);

        // garden tour
        if(tourOn){
            tourAcc+=dtReal;
            if(tourAcc>10 && bloomDir>0 && bloomT>=1){
                tourAcc=0;
                setFlower(ORDER[(ORDER.indexOf(currentFlower)+1)%ORDER.length]);
            }
        }

        // occasional chimes
        if(audioOn){
            chimeAcc+=dtReal;
            if(chimeAcc>3.2+Math.sin(time*0.13)*1.4){ chimeAcc=0; chime(); }
        }

        currentZoom+=(targetZoom-currentZoom)*0.1;
        camera.position.z=currentZoom; camera.position.y=1.5+currentZoom*0.02;
        camera.lookAt(0,0.85,0);
        // keepsake reveal: only legible once the viewer has zoomed in very close
        if(window.__mk){
            const mk=window.__mk;
            // fully hidden until zoom passes ~3.4, full at ~2.0
            let rev=(3.4-currentZoom)/1.4; rev=Math.max(0,Math.min(1,rev));
            const tw=0.72+Math.sin(time*1.7)*0.05;
            mk.material.opacity=rev*rev*tw;
            mk.visible=rev>0.001;
        }
        renderFrame();
    }

    window.addEventListener('resize',function(){
        w=window.innerWidth; h=window.innerHeight;
        camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
        renderFrame.resize();
    });

    canvas.style.cursor='grab';
    setFlower('peony'); bloomT=1;
    setWeather('aurora',true);
    animate();
})();
</script>
</body>
</html>
